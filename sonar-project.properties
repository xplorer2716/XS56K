# SonarCloud analysis settings (https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/).

# Leave out every directory whose name starts with a dot, at any depth, and what is under it: the tooling and the
# process folders (.github, .claude, .vscode, .rtk, .grepai, .archify, ...) are not the product's code.
# Also leave out juce/tests: test code is not fixed for style rules (RQ-QLT-002).
sonar.exclusions=**/.*/**,juce/tests/**
