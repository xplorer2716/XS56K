# scc configuration for the juce/ tree. Run it from the repository root:
#
#     scc @scc-juce.conf
#
# scc expands this file as if its lines were typed on the command line, so the
# positional path below is the target and must stay the only argument of the
# call. (A project .sccconfig cannot hold a path, which is why this file is
# passed with @ instead.) For the same reason, scc --report options such as
# --report-skip cannot be added after the file: they are written here.

# Target: the juce/ directory, relative to the repository root.
juce

# Skip every directory whose name starts with "build" (juce/build,
# juce/build-run, juce/build-win-local, ...) at any depth. The pattern is a
# regular expression on the path: a segment that starts with "build" and is
# followed by a separator. Files such as juce/buildinfo.h are still counted.
--not-match '(^|[\\/])build[^\\/]*[\\/]'

# HTML report (same as scc --report), written to the repository root. It reads
# the git history, so it takes a while; comment this line out to skip it.
--report=scc-juce-report.html
