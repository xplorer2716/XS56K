# AI: Template initialization (see .template/INIT.md, batch E):
# AI: - replace the {{COMPONENTS}} options with the project's real components (or delete the "component" field);
# AI: - delete all "# AI:" comments when done.
name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Focus on the **problem** first: a well-described need is more useful
        than a detailed solution, and lets maintainers find the best way to address it.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this feature has not been requested yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        What are you trying to achieve, and what prevents you from doing it today?
        Who is affected, and how often?
      placeholder: "Example: I export reports every day and have to rename each file by hand because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What solution would you like?
      description: Describe how it could work from a user's point of view. What would you type, click or configure?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you considered?
      description: Workarounds you use today, other tools, or other designs you thought about. Why are they not enough?

  - type: textarea
    id: acceptance
    attributes:
      label: How will we know it is done?
      description: List concrete, verifiable criteria that the feature must meet.
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: dropdown
    id: importance
    attributes:
      label: How important is this for you?
      options:
        - Nice to have
        - Important — I have a workaround
        - Blocking — I cannot use the project without it
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Related component
      options:
        - "{{COMPONENTS}}"
        - I don't know

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      description: See CONTRIBUTING.md. It is fine to say no!
      options:
        - "No"
        - Yes, with some guidance
        - Yes, I can submit a pull request
    validations:
      required: true
